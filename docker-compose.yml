services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: ragproof
      POSTGRES_USER: ragproof
      POSTGRES_PASSWORD: ragproof_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ragproof-db-data:/var/lib/postgresql/data
      - ./docker/init/10-create-test-db.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragproof -d ragproof"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ragproof-db-data:
