[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragproof"
version = "0.1.0"
description = "RagProof D1 backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "openai>=1.68,<3",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0.36,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["backend*", "scripts*"]
